spring.application.name=nestly-backend

# Database: local fallback for development; cloud URL supplied at deployment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nestly}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Authentication secret must be supplied through the environment
jwt.secret=${JWT_SECRET}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Use the port supplied by the hosting platform
server.port=${PORT:8080}

# CORS allowed origins (comma-separated, fallback to local Vite dev server)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}