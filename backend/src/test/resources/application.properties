spring.application.name=nestly-backend

# In-memory H2 database in PostgreSQL mode for isolated hermetic testing
spring.datasource.url=jdbc:h2:mem:nestly_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test JWT secret (256-bit key for HMAC-SHA256)
jwt.secret=nestly-secure-test-jwt-secret-key-at-least-256-bits-long-for-testing-purposes-1234567890

# JPA / Hibernate for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
